name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions ancladas por SHA completo (docs/07 §T8: un tag es mutable y puede
# repuntarse). El comentario indica la versión; Dependabot (github-actions)
# actualiza SHA y comentario a la vez.
jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Binario directo (no la action): escanea TODA la historia sin depender
      # del rango base..head del evento, que peta en el primer push por el
      # commit raíz (`<root>^` no existe). Pinneado por versión + sha256.
      - name: Instalar gitleaks (verificado por sha256)
        run: |
          VERSION=8.24.3
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Escanear toda la historia
        run: ./gitleaks detect --source . --redact --no-banner

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build y tests (Testcontainers usa el Docker del runner)
        working-directory: api
        run: ./gradlew --no-daemon build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  smoke:
    name: Smoke (make up + health) — criterio Fase 0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar .env (credenciales generadas al vuelo)
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
      - name: make up (con --wait, el código de salida ES el veredicto)
        run: make up
      - name: Comprobar /actuator/health = UP
        run: |
          set -o pipefail
          curl -fsS http://localhost:8080/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'
      - name: Endpoint MVT sirve una tesela (200 + Content-Type)
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          # El seed no corre en smoke: se siembra la huella mínima de Castelló para que la tesela
          # traiga geometría (sin datos, el endpoint devuelve 204). z8/127/96 contiene el término.
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "insert into municipio (ine_code, nombre, comarca, geom, superficie_ha, poblacion)
             select '12040','Castelló de la Plana','La Plana Alta', g, st_area(g)/10000.0, 1
             from (select st_multi(st_buffer(
               st_transform(st_setsrid(st_makepoint(-0.0376,39.9864),4326),25830),2000)) g) t
             on conflict (ine_code) do nothing;"
          code=$(curl -s -D /tmp/mvt.h -o /tmp/mvt.bin -w '%{http_code}' \
            http://localhost:8080/api/v1/tiles/municipios/8/127/96.mvt)
          echo "HTTP $code"; cat /tmp/mvt.h
          test "$code" = "200"
          grep -qi '^content-type: *application/vnd.mapbox-vector-tile' /tmp/mvt.h
          test -s /tmp/mvt.bin
      - name: make down
        if: always()
        run: make down
