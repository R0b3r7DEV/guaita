name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# NOTA: las actions van por tag; Dependabot (github-actions) las gestiona y se
# pinnearán por SHA una vez fijadas las versiones (práctica de docs/07 §T8).
jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build y tests (Testcontainers usa el Docker del runner)
        working-directory: api
        run: ./gradlew --no-daemon build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
