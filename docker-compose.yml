# GUAITA — orquestación local. Tres servicios: db, api, web (ADR-05, sin cuarto
# servicio de tiles: el MVT lo sirve la propia api con ST_AsMVT, ADR-04).
# Las variables se leen de .env (copiar desde .env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # expuesto para iteración local; cerrar en producción
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY}
      AEMET_API_KEY: ${AEMET_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "5173:80" # casa con la URL documentada del visor (README)
    healthcheck:
      # busybox wget (nginx:alpine). IPv4 explícito: `localhost` puede resolver a
      # ::1 y nginx (listen 80) solo escucha IPv4 -> falso unhealthy. Flags
      # separados (-q -O), el pegado -qO- es frágil en busybox.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  db_data:
