server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida sirve index.html (routing en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El visor pide /api al mismo origen; nginx lo reenvía a la api del compose.
    # (En el VPS es Apache quien hace de reverse proxy por delante; esto mantiene
    # el stack compose autocontenido y funcional también sin Apache.)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets con hash son inmutables; cachear agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
