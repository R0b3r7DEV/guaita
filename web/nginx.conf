server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida sirve index.html (routing en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash son inmutables; cachear agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
