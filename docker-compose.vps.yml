# ==========================================================================
# Override de DESPLIEGUE en VPS. GUAITA puede convivir con XPL0DAY (en
# producción): este override existe para que el backfill —horas escribiendo
# y descargando— NO monopolice ni tumbe la máquina compartida.
#
#   NO toca docker-compose.yml (base). Todo parametrizable por .env, para
#   esquivar colisiones de puerto y ajustar recursos SIN editar ficheros.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml down
#
# Los valores por defecto son conservadores (pensados para dejar aire a lo
# que ya corre en el VPS); ajústalos en .env tras ver `free -h` y
# `docker stats`. Justificación de cada límite en el README (§Despliegue VPS).
# ==========================================================================
services:
  db:
    # El bind del host se fija en el compose base con DB_BIND (en el VPS,
    # DB_BIND=127.0.0.1: cierra la BD a loopback). Aquí NO se declaran ports:
    # compose los CONCATENA con los del base y duplicaría el binding.
    restart: unless-stopped
    # 1 GB basta para PostGIS sobre una provincia (~1 GB de datos, ~1 M filas);
    # 1 CPU absorbe los picos de las agregaciones/percentiles del informe sin
    # comerse los núcleos que necesita producción.
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    # Rotación de logs: sin esto, el json-file de Docker crece sin límite y
    # llena el disco (causa clásica de caída en VPS pequeños).
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  api:
    # Bind del host vía API_BIND en el compose base (VPS: 172.17.0.1:).
    restart: unless-stopped
    # El backfill parsea en memoria la respuesta horaria de un año para 135
    # localizaciones (JSON de decenas de MB, estimado ~50-70 MB; Jackson lo
    # materializa entero -> pico de heap ~250-300 MB). 1 GB de contenedor, 1 CPU.
    mem_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-1.0}
    environment:
      # -Xmx EXPLÍCITO por debajo del mem_limit: sin él la JVM puede no respetar
      # el cgroup y el OOM-killer mata el contenedor sin traza. Deja ~360 MB para
      # no-heap (metaspace, hilos, code cache). ExitOnOutOfMemoryError: si aun así
      # revienta, sale limpio (el tramo aborta y es reanudable), no queda a medias.
      JAVA_TOOL_OPTIONS: "-Xmx${API_XMX:-640m} -XX:+ExitOnOutOfMemoryError"
      # Guardia de disco: vigila el disco del HOST (bind read-only de abajo),
      # no el efímero del contenedor. Umbral configurable.
      GUAITA_BACKFILL_DISK_GUARD_PATH: /hostdisk
      GUAITA_BACKFILL_DISK_MIN_FREE_GB: ${DISK_MIN_FREE_GB:-5}
      # Job diario de meteo+FWI. false por defecto; se pone a true en .env SOLO tras el backfill.
      GUAITA_SCHEDULER_ENABLED: ${GUAITA_SCHEDULER_ENABLED:-false}
    volumes:
      # Disco del host montado SOLO-LECTURA para que la guardia mida el espacio
      # real donde viven el volumen de Postgres y /data. Por defecto la raíz;
      # si Docker vive en otra partición, apúntala con DISK_GUARD_HOST_PATH.
      - "${DISK_GUARD_HOST_PATH:-/}:/hostdisk:ro"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  web:
    # Bind del host vía WEB_BIND en el compose base (VPS: 172.17.0.1:).
    restart: unless-stopped
    # nginx sirviendo estáticos: mínimo.
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # Sin restart (es un one-shot del profile etl); solo rotación de logs.
  etl:
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
