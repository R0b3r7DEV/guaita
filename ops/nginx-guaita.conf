# =====================================================================
# GUAITA · bloque de nginx para guaita.xpl0day.com
# =====================================================================
# Se AÑADE a la config del frontend de producción (xpl0day-frontend:
# ~/xpl0day/nginx/default.conf). No sustituye a los bloques de xpl0day.
#
# Hace de reverse proxy a los contenedores de GUAITA, que corren en un
# Docker ROOTLESS aparte y publican SOLO en el loopback del host
# (127.0.0.1:5173 visor, :8080 API) — cerrados a Internet. Para que este
# frontend los alcance, su servicio debe correr en network_mode: host (los
# contenedores del daemon root NO llegan a los puertos del rootless por el
# bridge). Cert dedicado de guaita en /etc/letsencrypt (montado :ro).
#
# En ~/xpl0day/docker-compose.yml, el servicio frontend necesita:
#     network_mode: host        # y quitar el bloque ports: (lo ignora)
# Tras pegar este fichero y editar el compose:
#     cd ~/xpl0day && docker compose up -d --build
# =====================================================================

# Límite de peticiones por IP (T4, docs/07). Va en contexto http; este
# fichero se incluye dentro de http{} (conf.d), así que aquí es válido.
limit_req_zone $binary_remote_addr zone=guaita:10m rate=20r/s;

# HTTP -> HTTPS
server {
    listen 80;
    server_name guaita.xpl0day.com;
    return 301 https://$host$request_uri;
}

# Visor + API
server {
    listen 443 ssl;
    server_name guaita.xpl0day.com;
    server_tokens off;

    # Cert DEDICADO de guaita, emitido por certbot (DNS-01) en el VPS. Vive bajo
    # /etc/letsencrypt (que el contenedor monta :ro). No toca el cert de xpl0day.
    ssl_certificate     /etc/letsencrypt/live/guaita.xpl0day.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guaita.xpl0day.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad (docs/07). CSP con las excepciones de MapLibre:
    #  - worker-src/child-src blob: -> MapLibre crea sus web workers desde blob URLs
    #  - img-src data: blob:        -> canvas y glyphs en memoria
    #  - style-src 'unsafe-inline'  -> MapLibre inyecta estilos en línea
    # El visor (Vite) NO usa scripts inline -> script-src queda en 'self' (estricto).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src blob:; child-src blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API + teselas MVT -> contenedor api de guaita, publicado en el loopback del
    # host (127.0.0.1:8080). El frontend lo alcanza porque corre en network_mode:
    # host. Sin barra final en proxy_pass: se conserva el /api/v1/... de Spring.
    location /api/ {
        limit_req zone=guaita burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Visor (SPA estática servida por el contenedor web)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
