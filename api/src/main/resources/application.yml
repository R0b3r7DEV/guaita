spring:
  # Parámetros del índice de peligro (docs/04). Fichero versionado aparte: gobierna
  # la reproducibilidad y se estampa como version_modelo en cada cálculo (docs/04 §5).
  config:
    import: "classpath:model-params.yml"

  application:
    name: guaita-api

  datasource:
    # Sin defaults en credenciales ni nombre de BD: un entorno mal configurado
    # debe fallar al arrancar, no conectarse con una credencial conocida y
    # documentada en un repo público. (Tests: @ServiceConnection de
    # Testcontainers sustituye este datasource; no dependen de estos valores.)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema; Hibernate no toca la BD.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # locations por defecto: classpath:db/migration (convención Spring).

server:
  # Detrás de nginx (proxy de confianza): Tomcat aplica X-Forwarded-* SOLO desde proxies internos,
  # así getRemoteAddr() trae la IP real del cliente sin confiar en un XFF spoofeado (rate limit login).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
