spring:
  application:
    name: guaita-api

  datasource:
    # Sin defaults en credenciales ni nombre de BD: un entorno mal configurado
    # debe fallar al arrancar, no conectarse con una credencial conocida y
    # documentada en un repo público. (Tests: @ServiceConnection de
    # Testcontainers sustituye este datasource; no dependen de estos valores.)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema; Hibernate no toca la BD.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # locations por defecto: classpath:db/migration (convención Spring).

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
