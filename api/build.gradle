plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.2'
}

group = 'dev.r0b3r7'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Control de acceso IUF (T2, docs/07): Spring Security + JWT (resource-server = decoder/encoder
	// nimbus para el access token HS256) + BouncyCastle (Argon2id de contraseñas).
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
	// Informe municipal IUF en PDF (docs/05). OpenPDF (LGPL/MPL): apto para repo público, sin la
	// AGPL de iText 7. API clásica com.lowagie.text, estable y documentada.
	implementation 'com.github.librepdf:openpdf:1.3.35'
	// Parseo del JSON de Open-Meteo (Boot 4 no trae jackson-databind por el starter web).
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// Decodifica el MVT que emite el endpoint (bytes -> features JTS con atributos) para probar
	// que la feature de Castelló viaja de verdad, no solo que el status es 200. En Maven Central
	// (Apache-2.0); la alternativa no.ecc.vectortile solo está en JitPack (menos auditable).
	testImplementation 'com.wdtinc:mapbox-vector-tile:3.1.0'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'   // imprime el mensaje de aserción en el log de CI, no solo la línea
		showCauses = true
		showStackTraces = true
	}
}
